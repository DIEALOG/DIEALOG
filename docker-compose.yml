services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diealog-backend
    restart: unless-stopped
    # The Go services read their configuration from /app/.env only (viper reads
    # the file, not the process environment), so each one gets its own env file.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./env/backend.env:/app/.env:ro
    depends_on:
      postgres-backend:
        condition: service_healthy
    networks:
      - diealog-backend-net
      - diealog-internal-net

  crypto:
    build:
      context: ./crypto
      dockerfile: Dockerfile
    container_name: diealog-crypto
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "${CRYPTO_PORT:-8081}:8080"
    volumes:
      - ./env/crypto.env:/app/.env:ro
    depends_on:
      postgres-crypto:
        condition: service_healthy
    networks:
      - diealog-crypto-net
      - diealog-internal-net

  postgres-backend:
    image: postgres:17
    container_name: diealog-postgres-backend
    restart: always
    environment:
      POSTGRES_USER: ${BACKEND_DB_USER:-diealog_backend}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASS:-diealog_backend_password}
      POSTGRES_DB: ${BACKEND_DB_NAME:-diealog_backend}
    ports:
      - "127.0.0.1:${HOST_BACKEND_DB_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BACKEND_DB_USER:-diealog_backend} -d ${BACKEND_DB_NAME:-diealog_backend}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-backend-data:/var/lib/postgresql/data
    networks:
      - diealog-backend-net

  postgres-crypto:
    image: postgres:17
    container_name: diealog-postgres-crypto
    restart: always
    environment:
      POSTGRES_USER: ${CRYPTO_DB_USER:-diealog_crypto}
      POSTGRES_PASSWORD: ${CRYPTO_DB_PASS:-diealog_crypto_password}
      POSTGRES_DB: ${CRYPTO_DB_NAME:-diealog_crypto}
    ports:
      - "127.0.0.1:${HOST_CRYPTO_DB_PORT:-5443}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRYPTO_DB_USER:-diealog_crypto} -d ${CRYPTO_DB_NAME:-diealog_crypto}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-crypto-data:/var/lib/postgresql/data
    networks:
      - diealog-crypto-net

volumes:
  postgres-backend-data:
  postgres-crypto-data:

networks:
  diealog-backend-net:
    driver: bridge
  diealog-crypto-net:
    driver: bridge
  diealog-internal-net:
    driver: bridge
