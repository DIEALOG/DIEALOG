services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - profile-uploads:/app/public
      - type: bind
        source: ./env/backend.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres-backend:
        condition: service_healthy
    networks:
      - diealog-backend-net
      - diealog-internal-net
      - diealog-network

  crypto:
    build:
      context: ./crypto
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./env/crypto.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres-crypto:
        condition: service_healthy
    networks:
      - diealog-crypto-net
      - diealog-internal-net

  postgres-backend:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${BACKEND_DB_USER:-diealog_backend}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASS:-diealog_backend_password}
      POSTGRES_DB: ${BACKEND_DB_NAME:-diealog_backend}
    ports:
      - "127.0.0.1:${HOST_BACKEND_DB_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BACKEND_DB_USER:-diealog_backend} -d ${BACKEND_DB_NAME:-diealog_backend}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-backend-data:/var/lib/postgresql/data
    networks:
      - diealog-backend-net

  postgres-crypto:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${CRYPTO_DB_USER:-diealog_crypto}
      POSTGRES_PASSWORD: ${CRYPTO_DB_PASS:-diealog_crypto_password}
      POSTGRES_DB: ${CRYPTO_DB_NAME:-diealog_crypto}
    ports:
      - "127.0.0.1:${HOST_CRYPTO_DB_PORT:-5443}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRYPTO_DB_USER:-diealog_crypto} -d ${CRYPTO_DB_NAME:-diealog_crypto}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-crypto-data:/var/lib/postgresql/data
    networks:
      - diealog-crypto-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - diealog-network
    restart: unless-stopped

volumes:
  postgres-backend-data:
  postgres-crypto-data:
  profile-uploads:

networks:
  diealog-network:
    driver: bridge
  diealog-backend-net:
    driver: bridge
  diealog-crypto-net:
    driver: bridge
  diealog-internal-net:
    driver: bridge
